name: Witness Vote Check

on:
  schedule:
    # Roda automaticamente todo dia às 21:00 UTC (18:00 Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch:
    # Permite rodar manualmente clicando em "Run workflow"

jobs:
  check-witnesses:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Run Witness Check Script
      run: node scripts/fetch_witness_check.js

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/witness_votes.json data/witness_history.json
        git commit -m "update: witness votes data [skip ci]" || echo "No changes to commit"
        git push
