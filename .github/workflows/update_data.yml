name: Update Dashboard Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Executa a cada 6 horas automaticamente
  workflow_dispatch:       # Gatilho manual com opções
    inputs:
      force_report:
        description: 'Forçar Relatório Mensal (IA)?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Run Data Fetch Script
      run: node scripts/fetch_delegations.js

    - name: Generate AI Report
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Mapeia a escolha do usuário para a variável que o script entende
        FORCE_REPORT: ${{ inputs.force_report }} 
      run: node scripts/generate_report.js

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Adiciona pastas recursivamente para garantir que novos relatórios sejam pegos
        git add data/ config/lists.json reports/
        
        # Commita apenas se houver mudanças
        git commit -m "auto: update data [manual trigger]" || echo "No changes to commit"
        git push
