name: Main Data Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Roda a cada 6 horas
  workflow_dispatch:        # Execução manual

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      # PASSO ÚNICO E ROBUSTO: Coleta tudo de uma vez
      - name: Fetch All Data (Unified)
        run: node scripts/fetch_data.js

      # Histórico e Metadados
      - name: Merge History & Meta
        run: node scripts/merge_data.js

      # Relatório IA
      - name: Generate AI Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate_report.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/*.json config/lists.json reports/*.md
          
          if git diff --staged --quiet; then
            echo "Nenhuma mudança."
          else
            git commit -m "Auto: Data Update"
            git push
          fi
