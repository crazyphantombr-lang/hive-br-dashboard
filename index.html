<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive BR Dashboard v2.25.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #13131f !important; /* Cor de fundo opaca do dashboard */
            z-index: 10;
            min-width: 150px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
        }
        table { border-collapse: separate; border-spacing: 0; }
    </style>
    <script defer src="main.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="last-updated" id="last-updated">Carregando dados...</div>
            <h1>HIVE BR <span class="highlight">DASHBOARD</span></h1>
            <p class="subtitle">Ranking de Curadoria e Estatísticas</p>
        </header>

        <div class="highlight-cards-grid">
            
            <div class="project-card" style="border-color: #ffcc00;">
                <div class="project-icon" title="Total de votos realizados pela curadoria da HiveBR em Janeiro 2026.">
                    <span style="font-size: 3rem;">🗳️</span>
                </div>
                <div class="project-info">
                    <h3 id="lbl-votes-current">VOTOS DISTRIBUÍDOS</h3>
                    <p id="stat-votes-current" style="color: #ffcc00;">0</p>
                </div>
            </div>

            <div class="project-card" style="border-color: #bb86fc;">
                <div class="project-icon" title="Contas que seguem a trilha de curadoria oficial da @hive-br.voter.">
                    <span style="font-size: 3rem;">👣</span>
                </div>
                <div class="project-info">
                    <h3>TRILHA DE CURADORIA</h3>
                    <p id="stat-trail-count" style="color: #bb86fc;">0</p>
                </div>
            </div>

            <div class="project-card" style="border-color: #009c3b;">
                <div class="project-icon" title="Brasileiros (verificados ou não) com atividade (post/comentário) nos últimos 30 dias.">
                    <span style="font-size: 3rem;">🇧🇷</span>
                </div>
                <div class="project-info">
                    <h3>BRASILEIROS ATIVOS</h3>
                    <p id="stat-active-br" style="color: #009c3b;">0</p>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="main-table">
                <thead>
                    <tr>
                        <th class="sticky-col">Usuário</th>
                        <th>Delegação</th>
                        <th>Tempo</th>
                        <th>HP Próprio</th>
                        <th>Power Down</th>
                        <th>HBR Stake</th>
                        <th>Última Atividade</th>
                        <th>Última Curadoria</th>
                        <th>Bônus Rank</th>
                        <th>Bônus HBR</th>
                        <th>Trilha</th>
                        <th>Histórico</th>
                    </tr>
                </thead>
                <tbody id="ranking-body"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
